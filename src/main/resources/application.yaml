app:
  frontend-login-success-url: ${FRONTEND_LOGIN_SUCCESS_URL:http://localhost:5173/auth/steam/complete}

spring:
  application:
    name: SteamInfoSite

  datasource:
    driver-class-name: org.postgresql.Driver
    #PostgreSQL드라이버 배치 INSERT재작성 최적화 활성화
    url: jdbc:postgresql://localhost:5432/SteamInfoSite?reWriteBatchedInserts=true
    username: icelettuce
    password: icelettuce1234

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        #같은종류의 SQL을 최대 100개씩 JDBC배치로 전달
        jdbc:
          batch_size: 100
          #같은종류의 INSERT와 UPDATE를 모아서 실행
        order_inserts: true
        order_updates: true
    show-sql: false

steam:
  genre:
    refresh:
      enabled: true
      cron: "0 0 * * * *"
  api:
    key: ${STEAM_API_KEY:}
  security:
    api-key-encryption-key: ${STEAM_API_KEY_ENCRYPTION_KEY:}
  openid:
    login-url: https://steamcommunity.com/openid/login  #사용자를 보낼 스팀openId 로그인 주소
    realm: ${STEAM_OPENID_REALM:http://localhost:8080/} #스팀에 알려주는 백엔드의 기본 주소
    return-url: ${STEAM_OPENID_RETURN_URL:http://localhost:8080/api/auth/steam/callback}  #로그인 완료후 돌아올 백엔드 주소
  collector:
    initial-delay-ms: 1300  #최초 요청 간격
    min-delay-ms: 1300       #최고 속도
    max-delay-ms: 3000      #최저 속도
    success-threshold: 500  #속도 상승하기 위한 성공 갯수
    decrease-step-ms: 50   #연속 성공시 요청 간격 축소
    increase-step-ms: 100   #429 발생시 요청 간격 증가