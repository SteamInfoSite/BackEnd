    api-key-encryption-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  openid:
    login-url: https://steamcommunity.com/openid/login
    realm: http://localhost:8080/
    return-url: http://localhost:8080/api/auth/steam/callback