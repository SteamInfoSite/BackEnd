services:
  postgres:
    image: postgres:16
    container_name: steam_info_site
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - steam_info_site_postgres_data:/var/lib/postgresql/data

volumes:
  steam_info_site_postgres_data: