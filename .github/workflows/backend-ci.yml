name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Run backend tests
        run: bash ./gradlew test --no-daemon

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: backend-production
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build executable JAR
        run: bash ./gradlew bootJar --no-daemon

      - name: Get temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::810876577038:role/SteamInfoSiteBackendDeployRole
          aws-region: ap-northeast-2

      - name: Upload JAR to S3
        run: |
          jar_path="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' -print -quit)"
          test -n "$jar_path"
          aws s3api put-object \
            --bucket steaminfosite-cd-artifacts-810876577038 \
            --key "backend/${GITHUB_SHA}/app.jar" \
            --body "$jar_path" \
            --query ETag \
            --output text

      - name: Deploy and check result
        run: |
          set -euo pipefail
          instance_id="i-03d2cf4a198422ab8"
          parameters="$(printf '{"commands":["/usr/local/sbin/steaminfosite-deploy-backend %s"]}' "$GITHUB_SHA")"

          command_id="$(aws ssm send-command \
            --instance-ids "$instance_id" \
            --document-name AWS-RunShellScript \
            --parameters "$parameters" \
            --timeout-seconds 600 \
            --query 'Command.CommandId' \
            --output text)"

          echo "SSM command ID: $command_id"
          status=""
          for attempt in $(seq 1 60); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$instance_id" \
              --query Status \
              --output text 2>/dev/null || true)"
            case "$status" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$instance_id" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

          test "$status" = Success